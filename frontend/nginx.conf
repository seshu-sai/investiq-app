log_format investiq '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'request_time=$request_time upstream_connect_time=$upstream_connect_time '
                    'upstream_response_time=$upstream_response_time upstream_status=$upstream_status '
                    'upstream=$upstream_addr';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log investiq;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # A variable defers DNS lookup until requests arrive, and valid=10s
        # prevents keeping a backend's old private address after a redeploy.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 5s;
        set $api_upstream "${API_UPSTREAM}";
        proxy_pass http://$api_upstream$request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
